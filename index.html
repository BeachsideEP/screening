<title>Movement screen – Beachside EP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111111; --ink-2:#565D61; --bg:#FFFFFF; --surface:#FFFFFF; --tint:#E1F7FD; --line:#E6E6E6;
  --tide:#00728D; --tide-press:#005A70; --on-tide:#FFFFFF; --tide-wash:rgba(0,114,141,.09);
  --sky:#83DFF5; --sky-soft:#B2EBF9;
  --stage:#111111; --left:#83DFF5; --right:#FFFFFF; --centre:#B2EBF9;
  --good:#00728D; --warn:#A86A12; --bad:#B23A2A;
  --s0:#B23A2A; --s1:#C27A12; --s2:#83DFF5; --s3:#00728D; --s2-ink:#111111;
  --radius:12px;
  --font:"Atkinson Hyperlegible", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#F2F2F2; --ink-2:#A7B1B5; --bg:#111111; --surface:#1A1A1A; --tint:#12303A; --line:#2B2B2B;
    --tide:#83DFF5; --tide-press:#B2EBF9; --on-tide:#111111; --tide-wash:rgba(131,223,245,.12);
    --warn:#E0A443; --bad:#E0715F; --s0:#E0715F; --s1:#E0A443; --s3:#1E93AE; }
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
#app{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.15;margin:0}
h1{font-size:2.1rem;letter-spacing:-0.01em}
h2{font-size:1.25rem;margin-bottom:.75rem}
p{margin:0}
:focus-visible{outline:3px solid var(--tide);outline-offset:2px}

/* Buttons */
.btn{appearance:none;border:0;border-radius:var(--radius);min-height:56px;padding:0 1.25rem;font-weight:700;font-size:1.05rem;
  background:var(--tide);color:var(--on-tide);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;text-decoration:none}
.btn:active{background:var(--tide-press)}
.btn[disabled]{opacity:.45}
.btn.quiet{background:transparent;color:var(--tide);box-shadow:inset 0 0 0 2px var(--tide)}
.btn.quiet:active{background:var(--tide-wash)}
.btn.small{min-height:44px;font-size:.95rem;padding:0 1rem}
.btn.danger{background:transparent;color:var(--bad);box-shadow:none;padding:0}
.btn.wide{width:100%}
.link{appearance:none;background:none;border:0;color:var(--tide);font-weight:700;padding:.5rem 0;cursor:pointer;min-height:44px}

/* Pages */
.page{max-width:780px;margin:0 auto;padding:2rem 1.5rem 4rem}
.page-head{margin-bottom:2rem}
.brand-head{display:flex;align-items:center;gap:1.1rem;margin-bottom:1.25rem}
.brand-head img{width:84px;height:84px;flex:none}
.brand-head .brand{margin:0;color:var(--ink);font-weight:700;font-size:1.05rem;line-height:1.3}
.brand{color:var(--ink-2);font-size:1rem;margin-bottom:.35rem}
.lede{color:var(--ink-2);margin-top:.6rem;max-width:60ch}
section{margin-top:2.25rem}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list > li{border-bottom:1px solid var(--line)}
.row-btn{appearance:none;background:none;border:0;width:100%;text-align:left;padding:1rem .25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;cursor:pointer;min-height:64px}
.row-btn:active{background:var(--tide-wash)}
.row-title{font-weight:700;font-size:1.1rem}
.row-meta{color:var(--ink-2);font-size:.95rem}
.empty{color:var(--ink-2);padding:1rem 0}
.field{display:flex;flex-direction:column;gap:.35rem;flex:1}
.field label{font-size:.95rem;color:var(--ink-2)}
.field input,.field textarea,.search{border:2px solid var(--line);background:var(--surface);border-radius:var(--radius);min-height:52px;padding:.6rem .85rem;width:100%}
.field input:focus,.field textarea:focus,.search:focus{border-color:var(--tide);outline:none}
.form-row{display:flex;gap:.75rem;align-items:flex-end;flex-wrap:wrap}
.form-row .field.age{flex:0 0 110px}
.search{margin-bottom:.5rem}
.note{color:var(--ink-2);font-size:.95rem;margin-bottom:1rem;max-width:62ch}
.btn-row{display:flex;gap:.75rem;flex-wrap:wrap}
.notice{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;background:var(--surface);border-left:5px solid var(--warn);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:1.5rem;box-shadow:var(--card-shadow)}
.notice p{margin:0;max-width:70ch}
.ab-status{font-weight:700;margin:0 0 .8rem}
.ab-status.ok{color:var(--good)} .ab-status.warn{color:var(--warn)}
.top-nav{margin-bottom:1rem}

/* Client history */
.hist{width:100%;border-collapse:collapse;font-size:1rem}
.hist th{text-align:left;color:var(--ink-2);font-weight:400;padding:.5rem .4rem;border-bottom:2px solid var(--line)}
.hist td{padding:.85rem .4rem;border-bottom:1px solid var(--line)}
.hist tr.click{cursor:pointer}
.hist tr.click:active td{background:var(--tide-wash)}
.hist td.num,.hist th.num{text-align:center}
.table-wrap{overflow-x:auto}
.tag{display:inline-block;font-size:.85rem;color:var(--warn);font-weight:700}

/* Score */
.score{display:inline-flex;align-items:center;justify-content:center;min-width:2.4em;height:2.4em;border-radius:50%;font-weight:700;color:#fff;font-size:1rem}
.score.s0{background:var(--s0)}.score.s1{background:var(--s1)}.score.s2{background:var(--s2);color:var(--s2-ink)}.score.s3{background:var(--s3)}
.score.none{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 2px var(--line)}
.overall{padding:1.25rem 1.25rem 1.25rem;background:var(--tint);border-radius:var(--radius)}
.overall-top{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.overall .pct{color:var(--tide);font-size:4.5rem;font-weight:700;line-height:1;letter-spacing:-0.02em}
.overall .of{color:var(--ink-2)}

/* Session test rows */
.test-row{display:grid;grid-template-columns:1fr auto;gap:.5rem 1.25rem;padding:1.25rem 0;border-bottom:1px solid var(--line)}
.test-row h3{font-size:1.2rem}
.test-row .view{color:var(--ink-2);font-size:.95rem}
.test-row .detail{grid-column:1 / -1;display:flex;flex-direction:column;gap:.2rem}
.test-row .flag{color:var(--warn);font-weight:700;font-size:.95rem}
.test-row .flag.bad{color:var(--bad)}
.test-row .controls{grid-column:1 / -1;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-top:.5rem}
.test-row select{border:2px solid var(--line);background:var(--surface);border-radius:var(--radius);min-height:44px;padding:0 .6rem}
.score-slot{display:flex;flex-direction:column;align-items:center;gap:.2rem}
.score-slot small{color:var(--ink-2);font-size:.8rem}

/* Test screen */
.test{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100%;background:var(--stage);color:#fff}
.camcol{display:flex;flex-direction:column;min-height:0;background:var(--stage)}
.camcol .stage{flex:1;min-height:0}
.stage-actions{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center;padding:.85rem 1rem;background:var(--stage)}
.stage-actions:empty{display:none}
.stage-actions .btn{flex:1 1 200px;max-width:340px;width:auto}
.stage-actions .btn.quiet{color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.85);background:transparent}

.cam-info{position:absolute;right:1rem;bottom:1rem;background:rgba(17,17,17,.72);color:#fff;padding:.4rem .75rem;border-radius:999px;font-size:.8rem}

.keys{font-size:.85rem;color:var(--ink-2)}
.keys kbd{font-family:inherit;font-size:.8rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .35rem;background:var(--surface);color:var(--ink)}
@media (hover: none){ .keys{display:none} }
.asks{display:flex;flex-direction:column;gap:.8rem;margin-top:1rem}
.stage{position:relative;overflow:hidden;background:var(--stage)}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage.mirror video,.stage.mirror canvas{transform:scaleX(-1)}
.stage-top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:1rem;gap:1rem;pointer-events:none}
.stage-top > *{pointer-events:auto}
.stage-btn{appearance:none;border:0;border-radius:999px;min-height:48px;padding:0 1.1rem;background:rgba(17,17,17,.72);color:#fff;font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer}
.legend{position:absolute;left:1rem;bottom:1rem;display:flex;gap:1rem;background:rgba(17,17,17,.72);padding:.5rem .85rem;border-radius:999px;font-size:.9rem;color:#fff}

.check{align-self:center;padding:.55rem 1rem;border-radius:999px;font-weight:700;font-size:.95rem;background:rgba(178,58,42,.9);color:#fff;white-space:nowrap}
.check.ok{background:rgba(0,114,141,.92)}
.check[hidden]{display:none}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(34vw,16rem);font-weight:700;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.5);pointer-events:none}
.count[hidden]{display:none}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center;padding:2rem;color:#fff}
.loading[hidden]{display:none}
.loading p{max-width:40ch}

.rail{background:var(--surface);color:var(--ink);display:flex;flex-direction:column;padding:1.5rem 1.25rem;gap:1.25rem;overflow-y:auto}
.rail h1{font-size:1.6rem}
.rail .view{color:var(--ink-2);margin-top:.25rem}
.trial-label{font-weight:700;color:var(--tide);font-size:1.05rem}
.readout{border-top:3px solid var(--sky);border-bottom:1px solid var(--line);padding:.75rem 0 1rem}
.readout .big{font-size:4.25rem;font-weight:700;line-height:1.05;letter-spacing:-0.02em;min-height:1.05em}
.readout .sub{color:var(--ink-2);min-height:1.45em}
.steps{margin:0;padding-left:1.3rem;color:var(--ink-2);font-size:1rem;display:flex;flex-direction:column;gap:.45rem}
.actions{display:flex;flex-direction:column;gap:.65rem;margin-top:auto}
.trial-result{background:var(--tint);border-radius:var(--radius);padding:1rem;display:flex;flex-direction:column;gap:.3rem}
.trial-result strong{font-size:1.1rem}

@media (max-width: 900px), (orientation: portrait){
  .test{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto;min-height:100%}
  .camcol .stage{flex:none;height:56vh;min-height:300px}
  .readout .big{font-size:3.25rem}
}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.8rem 1.2rem;border-radius:var(--radius);font-weight:700;z-index:50;max-width:90vw}
.toast.bad{background:var(--bad);color:#fff}
@media (prefers-reduced-motion: no-preference){ .toast{animation:rise .2s ease-out} @keyframes rise{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}} }

/* Movement rows */
.test-row{display:grid;grid-template-columns:minmax(0,1fr) 190px 72px;gap:.5rem 1.25rem;align-items:center;padding:1.4rem 0;border-bottom:1px solid var(--line)}
.test-row .tr-head{grid-column:1;grid-row:1}
.test-row .tr-bar{grid-column:1;grid-row:2}
.test-row .tr-trend{grid-column:2;grid-row:1 / span 2}
.test-row .tr-pct{grid-column:3;grid-row:1 / span 2;justify-self:end}
.test-row .detail,.test-row .controls{grid-column:1 / -1}
.mbar{position:relative;padding-bottom:1.3rem;margin-top:.2rem}
.mbar-track{height:14px;border-radius:7px}
.mbar-mark{position:absolute;top:-4px;width:4px;height:22px;border-radius:2px;background:var(--ink);transform:translateX(-50%);box-shadow:0 0 0 2px var(--surface)}
.mbar-label{position:absolute;top:19px;transform:translateX(-50%);font-size:.8rem;font-weight:700;color:var(--ink-2);white-space:nowrap}
.pct-circle{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;font-weight:700;font-size:1.45rem;line-height:1}
.pct-circle small{font-size:.75rem;margin-left:1px}
.pct-circle.none{box-shadow:inset 0 0 0 2px var(--line);color:var(--ink-2);font-size:1.2rem}
.spark{display:block;max-width:100%;height:auto}
.spark-cap{font-size:.75rem;color:var(--ink-2);text-align:center;margin-top:.1rem}
.overall-trend{margin-top:1.25rem;max-width:360px}
.overall-trend .spark-cap{text-align:left;margin:0 0 .2rem}
.cam-pick{display:inline-flex;align-items:center;padding:0 .6rem}
.cam-pick select{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:#fff;font-weight:700;max-width:220px;padding:0 .4rem;min-height:48px}
.cam-pick select option{color:#111}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width: 640px){
  .test-row{grid-template-columns:minmax(0,1fr) 72px}
  .test-row .tr-trend{grid-column:1 / -1;grid-row:auto}
  .test-row .tr-pct{grid-column:2}
}
/* Bands */
.band-chip{display:inline-block;padding:.3rem .7rem;border-radius:999px;font-weight:700;font-size:.9rem;white-space:nowrap}
.band-chart{position:relative;padding-top:1.9rem;margin-top:1.1rem}
.band-track,.band-labels{display:grid;grid-template-columns:40fr 20fr 15fr 15fr 10fr}
.band-track{position:relative;height:18px;border-radius:9px;overflow:hidden}
.band-track i{display:block}
.band-labels{margin-top:.4rem;font-size:.78rem;line-height:1.2;color:var(--ink-2)}
.band-labels span{text-align:center;padding:0 .15rem}
.band-marker{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:.95rem;line-height:1}
.band-marker::after{content:"";margin-top:3px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--ink)}
.band-prev{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #111;transform:translate(-50%,-50%)}
.band-legend{margin-top:.5rem;font-size:.85rem;color:var(--ink-2);display:flex;align-items:center;gap:.4rem}
.band-prev-key{display:inline-block;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #111}
.group-head{margin:2.25rem 0 0;padding-bottom:.6rem;border-bottom:2px solid var(--ink)}
.client-trend{margin-bottom:1.25rem}
.trend-wrap{overflow-x:auto}
.trend-wrap .spark{max-width:100%;height:auto}
.row-score{display:flex;align-items:center;gap:.6rem;flex:none}
.row-score strong{font-size:1.2rem}
.ask{display:flex;flex-direction:column;gap:.3rem;font-size:.95rem;color:var(--ink-2)}
.ask select{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--radius);min-height:48px;padding:0 .6rem;font-size:1rem}

/* ============ Visual refresh ============ */
:root{ --page:#F2F8FA; --ring-track:#E3EDF0; --r-lg:18px;
  --card-shadow:0 1px 2px rgba(17,17,17,.05), 0 12px 32px -14px rgba(0,114,141,.22); }

body{background:var(--page)}
.topbar{background:#111;color:#fff;position:relative}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#00728D,#83DFF5 35%,#B2EBF9 55%,#83DFF5 75%,#00728D)}

.wordmark em{font-style:normal;color:#83DFF5;font-size:1.25em;letter-spacing:.09em}
.topbar-title{color:#B2EBF9;font-weight:700}
.wrap{max-width:1180px;margin:0 auto;padding:1.75rem 2rem 4rem}
.crumb{margin-bottom:.6rem}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--card-shadow);padding:1.5rem 1.6rem;margin-bottom:1.5rem}

.hero{position:relative;overflow:hidden;background:#111;color:#fff;border-radius:24px;padding:2.1rem 2.4rem;margin-bottom:1.75rem;
  --ink:#FFFFFF;--ink-2:#A9B8BE;--line:rgba(255,255,255,.14);--tide:#83DFF5;--surface:#111111;--ring-track:rgba(255,255,255,.12)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero::before{width:430px;height:430px;right:-150px;top:50%;margin-top:-215px;border:4px solid rgba(131,223,245,.85);border-right-color:transparent;border-top-color:transparent;transform:rotate(15deg)}
.hero::after{width:470px;height:470px;right:-175px;top:50%;margin-top:-235px;border:1.5px solid rgba(131,223,245,.3);border-bottom-color:transparent;transform:rotate(-20deg)}
.client-hero::before{right:-300px}.client-hero::after{right:-325px}
.s-hero::before{right:-330px;opacity:.6}.s-hero::after{right:-355px;opacity:.6}

.eyebrow{color:#83DFF5;font-weight:700;margin-bottom:.35rem}
.btn.sky{background:#83DFF5;color:#111}
.btn.sky:active{background:#B2EBF9}
.hero .btn.quiet{color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.hero .btn.quiet:active{background:rgba(255,255,255,.1)}
.link.on-dark{color:#83DFF5;margin-left:.5rem}
.hero-actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.6rem}
.stats{display:flex;gap:3rem;margin-top:1.6rem;flex-wrap:wrap}

.stat span{color:var(--ink-2);font-size:.92rem}

.home-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:1.5rem;align-items:start}
.home-grid .card{margin-bottom:0}
.stack{display:flex;flex-direction:column;gap:1.5rem}
.form-stack{display:flex;flex-direction:column;gap:.9rem}

.clist{list-style:none;margin:0 -.6rem;padding:0}
.crow{display:flex;align-items:center;gap:1rem;width:100%;padding:.75rem .6rem;border:0;background:none;border-radius:14px;cursor:pointer;text-align:left;color:inherit}

.crow:active{background:var(--tide-wash)}
.crow-main{flex:1;min-width:0}
.avatar{flex:none;width:46px;height:46px;border-radius:50%;background:#111;color:#83DFF5;display:grid;place-items:center;font-weight:700;letter-spacing:.03em}

.ring{position:relative;display:inline-grid;place-items:center;flex:none}
.ring svg{position:absolute;inset:0}

@media (prefers-reduced-motion: no-preference){
  .ring .arc{animation:ringIn 1s cubic-bezier(.2,.8,.2,1) both}

}

.client-hero{display:flex;align-items:center;justify-content:space-between;gap:2rem;flex-wrap:wrap}

.who{display:flex;align-items:center;gap:1.35rem}

.s-trend .spark-cap{color:var(--ink-2);margin-bottom:.25rem}
@media (max-width: 1050px){ .s-hero{grid-template-columns:auto minmax(0,1fr)} .s-trend{grid-column:1 / -1} }
@media (max-width: 900px){ .home-grid{grid-template-columns:1fr} .s-hero{grid-template-columns:1fr} .s-ring{justify-self:start} .wrap,.topbar-in{padding-left:1.25rem;padding-right:1.25rem} .hero{padding:1.6rem} }

.group-head2{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin:2.1rem 0 1rem}

.mcard{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--card-shadow);padding:1.25rem 1.4rem 1.3rem;display:flex;flex-direction:column;gap:.9rem;border-top:5px solid var(--band, var(--line))}

.mcard .detail{display:flex;flex-direction:column;gap:.15rem;font-size:.97rem}

.notes-card{margin-top:2rem}

.st-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:1.5rem;align-items:start}

.hcheck{display:flex;align-items:center;gap:.5rem;min-height:48px;font-weight:700}
.hcheck input{width:22px;height:22px;accent-color:var(--tide)}

.tpl-links{display:inline-flex;align-items:center;gap:.6rem;color:var(--line)}
.tpl-group{color:var(--ink-2);font-weight:700;margin:1rem 0 .6rem}
.tpl-row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:1.5rem}
.tpl-pick{width:100%;text-align:left;border:2px solid var(--line);cursor:pointer;font:inherit;color:inherit}
.tpl-pick:hover{border-color:var(--tide);background:var(--tint)}

.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin:.25rem 0 .75rem}
.chip{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;min-height:40px;padding:0 .95rem;font-weight:700;font-size:.9rem;cursor:pointer}
.chip.on{background:#111;border-color:#111;color:#83DFF5}
.chip:hover{border-color:var(--tide)}
</style>

/* ---------- Small utilities ---------- */
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtDate = iso => new Date(iso).toLocaleDateString('en-AU', {day:'numeric', month:'short', year:'numeric'});
const ema = (prev, v, a) => prev == null ? v : prev + a * (v - prev);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const r1 = v => Math.round(v * 10) / 10;
const median = arr => { const s = arr.filter(Number.isFinite).sort((a,b) => a - b); return s.length ? s[Math.floor(s.length / 2)] : null; };
function Baseline(n = 45){
  const a = [];
  return { add(v){ if (Number.isFinite(v)){ a.push(v); if (a.length > n) a.shift(); } }, get(){ return median(a); }, size(){ return a.length; } };
}
function toast(msg, bad = false){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : ''); t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
function say(text){
  try {
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text); u.lang = 'en-AU'; u.rate = 1;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch(e){}
}

/* ---------- Storage ---------- */
function loadDB(){
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.clients)) return d; } catch(e){}
  return {version:1, clients:[]};
}
let db = loadDB();
function saveDB(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); scheduleAutoBackup(); return true; }
  catch(e){ toast('Couldn’t save – browser storage may be full. Export a backup.', true); return false; }
}

/* ---------- Automatic backup to a folder ----------
   The practitioner picks a folder once (ideally one that syncs, e.g. OneDrive).
   After every change the app writes bep-movement-screen-latest.json there,
   plus one dated copy per day. The 30 most recent dated copies are kept. */
const AB = {supported: 'showDirectoryPicker' in window, dir:null, state:'off', timer:null, busy:false, warned:false};
const AB_LAST = 'bep_fms_autobackup_last', AB_KEEP = 30, AB_PREFIX = 'bep-movement-screen-';
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('bep_fms', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function kvGet(k){ const d = await idb(); return new Promise(res => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); }
async function kvSet(k, v){ const d = await idb(); return new Promise(res => { const t = d.transaction('kv', 'readwrite'); v === undefined ? t.objectStore('kv').delete(k) : t.objectStore('kv').put(v, k); t.oncomplete = () => res(true); t.onerror = () => res(false); }); }
const localDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const abLast = () => { try { return localStorage.getItem(AB_LAST); } catch(e){ return null; } };
async function abInit(){
  if (!AB.supported) return;
  try {
    AB.dir = await kvGet('backupDir');
    if (!AB.dir){ AB.state = 'off'; return; }
    AB.state = (await AB.dir.queryPermission({mode:'readwrite'})) === 'granted' ? 'on' : 'paused';
    if (AB.state === 'on' && (!abLast() || localDay(new Date(abLast())) !== localDay(new Date()))) runAutoBackup();
  } catch(e){ AB.state = 'off'; }
}
async function abChoose(){
  try {
    const dir = await window.showDirectoryPicker({id:'bep-fms-backup', mode:'readwrite', startIn:'documents'});
    AB.dir = dir; await kvSet('backupDir', dir); AB.state = 'on';
    if (await runAutoBackup()) toast(`Automatic backup is on. Saving to “${dir.name}”.`);
  } catch(e){ if (e?.name !== 'AbortError') toast('Couldn’t use that folder. Try another.', true); }
}
async function abReconnect(){
  try {
    if (AB.dir && (await AB.dir.requestPermission({mode:'readwrite'})) === 'granted'){ AB.state = 'on'; await runAutoBackup(); toast('Automatic backup reconnected.'); return true; }
  } catch(e){}
  toast('Backup folder not reconnected. Choose the folder again in Backup.', true); return false;
}
async function abTurnOff(){ await kvSet('backupDir', undefined); AB.dir = null; AB.state = 'off'; }
function scheduleAutoBackup(){ if (AB.state !== 'on') return; clearTimeout(AB.timer); AB.timer = setTimeout(runAutoBackup, 3000); }
async function writeFile(dir, name, text){ const fh = await dir.getFileHandle(name, {create:true}); const w = await fh.createWritable(); await w.write(text); await w.close(); }
async function runAutoBackup(){
  if (!AB.dir || AB.state !== 'on' || AB.busy) return false;
  AB.busy = true;
  try {
    const text = JSON.stringify(db, null, 2), day = localDay(new Date());
    await writeFile(AB.dir, AB_PREFIX + 'latest.json', text);
    await writeFile(AB.dir, AB_PREFIX + day + '.json', text);
    const dated = [];
    for await (const [name, h] of AB.dir.entries()) if (h.kind === 'file' && /^bep-movement-screen-\d{4}-\d{2}-\d{2}\.json$/.test(name)) dated.push(name);
    dated.sort().reverse().slice(AB_KEEP).forEach(n => AB.dir.removeEntry(n).catch(() => {}));
    try { localStorage.setItem(AB_LAST, new Date().toISOString()); } catch(e){}
    AB.warned = false; return true;
  } catch(e){
    if (e?.name === 'NotAllowedError' || e?.name === 'SecurityError') AB.state = 'paused';
    if (!AB.warned){ AB.warned = true; toast('Automatic backup failed. Check the backup folder in Backup.', true); }
    return false;
  } finally { AB.busy = false; }
}

}

try { navigator.storage?.persist?.(); } catch(e){}
for (const k of ['bep_strength_decoders', 'bep_musclemeter_decoder']) { try { localStorage.removeItem(k); } catch(e){} }
const getClient = id => db.clients.find(c => c.id === id);
const getSession = (c, sid) => c?.sessions.find(s => s.id === sid);

/* ---------- Geometry ---------- */
let VW = 1, VH = 1; // video size in pixels, set every frame
const SIDE = {
  L:{ear:7, sh:11, el:13, wr:15, hip:23, knee:25, ank:27, heel:29, toe:31},
  R:{ear:8, sh:12, el:14, wr:16, hip:24, knee:26, ank:28, heel:30, toe:32}
};
const other = k => k === 'L' ? 'R' : 'L';
const deg = r => r * 180 / Math.PI;
const P = (lm, i) => ({x: lm[i].x * VW, y: lm[i].y * VH, v: lm[i].visibility ?? 1});
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const midp = (a, b) => ({x:(a.x + b.x) / 2, y:(a.y + b.y) / 2});
function pts(lm, k){ const o = {}; for (const n in SIDE[k]) o[n] = P(lm, SIDE[k][n]); return o; }
function ang(a, b, c){
  const v1x = a.x - b.x, v1y = a.y - b.y, v2x = c.x - b.x, v2y = c.y - b.y;
  const d = Math.hypot(v1x, v1y) * Math.hypot(v2x, v2y);
  return d ? deg(Math.acos(clamp((v1x * v2x + v1y * v2y) / d, -1, 1))) : NaN;
}
// Unsigned angle of a segment from vertical (0 = upright)
const fromVertical = (top, bottom) => deg(Math.atan2(Math.abs(top.x - bottom.x), bottom.y - top.y));
// Signed lean: + means the top point is ahead (in the facing direction) of the bottom point
const lean = (top, bottom, facing) => deg(Math.atan2((top.x - bottom.x) * facing, bottom.y - top.y));
// Unsigned tilt of a line from horizontal (0 = level)
function tilt(a, b){ let t = Math.abs(deg(Math.atan2(b.y - a.y, b.x - a.x))); return t > 90 ? 180 - t : t; }
const sideVis = (lm, k) => ['sh','hip','knee','ank'].reduce((s, n) => s + (lm[SIDE[k][n]].visibility ?? 0), 0) / 4;
const bestSide = lm => sideVis(lm, 'L') >= sideVis(lm, 'R') ? 'L' : 'R';
const facingOf = (lm, k) => { const s = pts(lm, k); return (s.toe.x - s.heel.x) >= 0 ? 1 : -1; };
const shoulderW = lm => dist(P(lm, 11), P(lm, 12));
const hipW = lm => dist(P(lm, 23), P(lm, 24));
const shMid = lm => midp(P(lm, 11), P(lm, 12));
const hipMid = lm => midp(P(lm, 23), P(lm, 24));
const ankMid = lm => midp(P(lm, 27), P(lm, 28));
// 1 = leg straight and vertical, falls as the hips drop (scale-free)
function legExt(lm, k){ const s = pts(lm, k); const L = dist(s.hip, s.knee) + dist(s.knee, s.ank); return L ? (s.ank.y - s.hip.y) / L : NaN; }
// 1 = thigh vertical (standing), 0 = thigh horizontal (seated)
function thighVert(lm, k){ const s = pts(lm, k); const L = dist(s.hip, s.knee); return L ? (s.knee.y - s.hip.y) / L : NaN; }
const trunkSideLean = lm => fromVertical(shMid(lm), hipMid(lm));
// Front view: + means the stance knee has moved inwards (towards the midline)
function kneeInward(lm, k){
  const s = pts(lm, k), oh = P(lm, SIDE[other(k)].hip);
  const dev = 180 - ang(s.hip, s.knee, s.ank);
  const t = (s.knee.y - s.hip.y) / ((s.ank.y - s.hip.y) || 1);
  const lineX = s.hip.x + t * (s.ank.x - s.hip.x);
  const medial = Math.sign(oh.x - s.hip.x) || 1;
  return dev * (Math.sign((s.knee.x - lineX) * medial) || 1);
}
// Front view: + means the hip on the free (non-stance) side is lower
function pelvisDrop(lm, k){ const s = P(lm, SIDE[k].hip), o = P(lm, SIDE[other(k)].hip); return deg(Math.atan2(o.y - s.y, Math.abs(o.x - s.x) || 1)); }

function bodyCheck(lm, view){
  if (!lm) return {ok:false, msg:'No one in view'};
  const vis = i => (lm[i].visibility ?? 0) > 0.5;
  const inF = i => lm[i].x > 0.01 && lm[i].x < 0.99 && lm[i].y > 0.01 && lm[i].y < 0.985;
  const k = bestSide(lm), s = SIDE[k];
  const chain = view === 'front' ? [11,12,23,24,25,26,27,28] : [s.sh, s.hip, s.knee, s.ank];
  const ankles = view === 'front' ? [27,28] : [s.ank];
  if (ankles.some(i => !inF(i))) return {ok:false, msg:'Feet not in view – move the camera back'};
  if (lm[0].y < 0.01 || !inF(view === 'front' ? 11 : s.sh)) return {ok:false, msg:'Head cut off – move the camera back'};
  if (chain.some(i => !vis(i))) return {ok:false, msg:'Whole body needs to be in view'};
  const ratio = shoulderW(lm) / (dist(P(lm, s.sh), P(lm, s.hip)) || 1);
  if (view === 'side' && ratio > 0.55) return {ok:false, msg:'Turn the client side-on'};
  if (view === 'front' && ratio < 0.45) return {ok:false, msg:'Turn the client to face the camera'};
  return {ok:true, msg:'Whole body in view'};
}

/* Tracks side-to-side and overall trunk sway, relative to shoulder width */
function SwayTracker(){
  let cx = null, cy = null, sw = null, prev = null, path = 0, minX = Infinity, maxX = -Infinity;
  return {
    add(lm){
      const m = shMid(lm), w = shoulderW(lm) || 1;
      if (sw == null) sw = w;
      cx = ema(cx, m.x, 0.35); cy = ema(cy, m.y, 0.35);
      const nx = cx / sw, ny = cy / sw;
      if (prev) path += Math.hypot(nx - prev.x, ny - prev.y);
      prev = {x:nx, y:ny}; minX = Math.min(minX, nx); maxX = Math.max(maxX, nx);
    },
    result(dur){ return {sway: r1((path / Math.max(dur, 0.1)) * 100), range: Number.isFinite(maxX) ? Math.round((maxX - minX) * 100) : 0}; }
  };
}

/* ============================================================
   Controllers
   Every controller has: begin(lm,t), frame(lm,t,api,phase),
   stop(t,manual), result(), unable(). phase: setup|countdown|run
   ============================================================ */

/* Generic rep counter. signal() gets bigger as the client goes deeper. */
function repController(cfg){
  const st = {state:'up', reps:[], cur:null, v:null, tDown:0, ctx:{}};
  return {
    begin(lm, t){ cfg.begin?.(st.ctx, lm); },
    frame(lm, t, api, phase){
      if (!lm) return;
      if (phase === 'setup' || phase === 'countdown'){ cfg.setup?.(lm, st.ctx); return; }
      if (phase !== 'run') return;
      const raw = cfg.signal(lm, st.ctx); if (!Number.isFinite(raw)) return;
      st.v = ema(st.v, raw, 0.5);
      cfg.track?.(lm, st.v, st.ctx, st.state);
      if (st.state === 'up'){
        if (st.v > cfg.down){ st.state = 'down'; st.tDown = t; st.cur = {depth:st.v, ...cfg.metrics(lm, st.ctx)}; }
      } else {
        if (st.v > st.cur.depth) st.cur = {...st.cur, depth:st.v, ...cfg.metrics(lm, st.ctx)};
        cfg.during?.(lm, st.cur, st.ctx);
        if (st.v < cfg.up){
          if (t - st.tDown > 350){ const rep = {...st.cur}; rep.faults = cfg.faults(rep, st.ctx); st.reps.push(rep); api.beep(); }
          st.state = 'up'; st.cur = null;
          if (st.reps.length >= cfg.target){ api.finish(); return; }
        }
      }
      api.live(`${st.reps.length} of ${cfg.target}`, st.state === 'down' ? (cfg.downText || 'Going down…') : (cfg.upText || 'Ready for the next rep'));
    },
    stop(){},
    result(){ return {reps:st.reps, unable:st.reps.length === 0}; },
    unable(){ return {reps:[], unable:true}; }
  };
}

/* Generic "reach your best, then come back" measure. */
function peakController(cfg){
  const st = {ctx:{}, peak:null, extra:{}, t0:0, v:null, aborted:null};
  return {
    begin(lm, t){ st.t0 = t; cfg.begin?.(st.ctx, lm); },
    frame(lm, t, api, phase){
      if (!lm) return;
      if (phase === 'setup' || phase === 'countdown'){ cfg.setup?.(lm, st.ctx); return; }
      if (phase !== 'run') return;
      const el = (t - st.t0) / 1000;
      const m = cfg.measure(lm, st.ctx);
      if (m && Number.isFinite(m.v)){
        st.v = ema(st.v, m.v, 0.5);
        if (m.ok !== false && (st.peak == null || st.v > st.peak)){ st.peak = st.v; st.extra = m.extra || {}; }
        if (m.abort){ st.aborted = m.abort; api.finish(); return; }
        if (st.peak != null && st.peak > cfg.startMin && st.v < st.peak - cfg.dropBy){ api.beep(); api.finish(); return; }
      }
      if (el > cfg.maxSec){ api.finish(); return; }
      api.live(cfg.fmt(st.peak ?? 0), `Best so far. Right now ${cfg.fmt(st.v ?? 0)}`);
    },
    stop(){},
    result(){ return {value: st.peak == null ? 0 : r1(st.peak), ...st.extra, aborted:st.aborted, unable: st.peak == null}; },
    unable(){ return {value:0, unable:true}; }
  };
}

/* 5x sit-to-stand: counts stands from how upright the thigh is */
function stsController(){
  const st = {running:false, reps:0, standing:false, armed:false, t0:0, repTimes:[], v:null, time:null};
  return {
    begin(lm, t){ st.running = true; st.t0 = t; },
    frame(lm, t, api, phase){
      if (phase !== 'run' || !lm) return;
      const el = (t - st.t0) / 1000;
      const tv = thighVert(lm, bestSide(lm));
      if (Number.isFinite(tv)){
        st.v = ema(st.v, tv, 0.65);
        if (st.v < 0.45){ st.armed = true; st.standing = false; }
        if (st.armed && !st.standing && st.v > 0.85){
          st.standing = true; st.reps++; st.repTimes.push(r1(el)); api.beep();
          if (st.reps >= 5){ st.time = el; api.finish(); return; }
        }
      }
      api.live(`${el.toFixed(1)} s`, `${st.reps} of 5 stands`);
    },
    stop(t){ if (st.running && st.time == null) st.time = (t - st.t0) / 1000; st.running = false; },
    result(){ return {time:+(st.time ?? 0).toFixed(2), reps:st.reps, completed:st.reps >= 5, repTimes:st.repTimes}; },
    unable(){ return {time:0, reps:0, completed:false, repTimes:[], unable:true}; }
  };
}

/* Single-leg balance */
function balController(stance){
  const liftI = stance === 'L' ? 28 : 27, standI = stance === 'L' ? 27 : 28, hipI = stance === 'L' ? 23 : 24;
  const liftName = stance === 'L' ? 'right' : 'left', standName = stance === 'L' ? 'left' : 'right';
  const st = {phase:'idle', tBegin:0, t0:null, tDown:null, time:null, sway:SwayTracker(), unable:false};
  return {
    begin(lm, t){ st.phase = 'waitLift'; st.tBegin = t; },
    frame(lm, t, api, phase){
      if (phase !== 'run' || !lm) return;
      const a = P(lm, liftI), s = P(lm, standI), h = P(lm, hipI);
      const lift = (s.y - a.y) / (dist(h, s) || 1);
      if (st.phase === 'waitLift'){
        api.live('0.0 s', `Lift the ${liftName} foot`);
        if (lift > 0.06){ st.phase = 'hold'; st.t0 = t; api.beep(); }
        else if (t - st.tBegin > 15000){ st.unable = true; api.finish(); }
        return;
      }
      if (st.phase === 'hold'){
        st.sway.add(lm);
        const el = (t - st.t0) / 1000;
        if (lift < 0.03){
          if (st.tDown == null) st.tDown = t;
          else if (t - st.tDown > 250){ st.time = (st.tDown - st.t0) / 1000; api.beep(); api.finish(); return; }
        } else st.tDown = null;
        if (el >= BAL_MAX){ st.time = BAL_MAX; api.beep(); api.finish(); return; }
        api.live(`${el.toFixed(1)} s`, `Standing on the ${standName} leg`);
      }
    },
    stop(t){
      if (st.phase === 'hold' && st.time == null) st.time = (t - st.t0) / 1000;
      if (st.phase === 'waitLift') st.unable = true;
      st.phase = 'done';
    },
    result(){ const time = r1(st.time ?? 0); return {time, unable: st.unable || time < 0.5, ...st.sway.result(time)}; },
    unable(){ return {time:0, unable:true, sway:0, range:0}; }
  };
}

/* Tandem stance: starts at Go (client already in position), stops when a foot moves */
function tandemController(){
  const st = {bx:Baseline(), by:Baseline(), x0:null, y0:null, t0:0, tLoss:null, time:null, sway:SwayTracker(), running:false};
  const feet = lm => {
    const la = P(lm, 27), ra = P(lm, 28), sw = shoulderW(lm) || 1, leg = dist(P(lm, 23), la) || 1;
    return {x: Math.abs(la.x - ra.x) / sw, y: (la.y - ra.y) / leg};
  };
  return {
    begin(lm, t){ st.t0 = t; st.running = true; st.x0 = st.bx.get() ?? (lm ? feet(lm).x : 0); st.y0 = st.by.get() ?? (lm ? feet(lm).y : 0); },
    frame(lm, t, api, phase){
      if (!lm) return;
      if (phase === 'setup' || phase === 'countdown'){ const f = feet(lm); st.bx.add(f.x); st.by.add(f.y); return; }
      if (phase !== 'run') return;
      const el = (t - st.t0) / 1000, f = feet(lm);
      st.sway.add(lm);
      if (Math.abs(f.x - st.x0) > 0.35 || Math.abs(f.y - st.y0) > 0.07){
        if (st.tLoss == null) st.tLoss = t;
        else if (t - st.tLoss > 250){ st.time = (st.tLoss - st.t0) / 1000; api.beep(); api.finish(); return; }
      } else st.tLoss = null;
      if (el >= BAL_MAX){ st.time = BAL_MAX; api.beep(); api.finish(); return; }
      api.live(`${el.toFixed(1)} s`, 'Holding heel-to-toe');
    },
    stop(t){ if (st.running && st.time == null) st.time = (t - st.t0) / 1000; st.running = false; },
    result(){ const time = r1(st.time ?? 0); return {time, unable: time < 0.5, ...st.sway.result(time)}; },
    unable(){ return {time:0, unable:true, sway:0, range:0}; }
  };
}

/* Marching on the spot for 20 s: knee lift each side, rhythm and sway */
function marchController(){
  const DUR = 20;
  const st = {t0:0, running:false, sway:SwayTracker(), base:{L:{knee:Baseline(), thigh:Baseline()}, R:{knee:Baseline(), thigh:Baseline()}},
              leg:{L:{up:false, peak:0, steps:[]}, R:{up:false, peak:0, steps:[]}}, b:{}, el:0};
  return {
    begin(lm, t){ st.t0 = t; st.running = true; for (const k of ['L','R']) st.b[k] = {knee: st.base[k].knee.get(), thigh: st.base[k].thigh.get()}; },
    frame(lm, t, api, phase){
      if (!lm) return;
      if (phase === 'setup' || phase === 'countdown'){
        for (const k of ['L','R']){ const s = pts(lm, k); st.base[k].knee.add(s.knee.y); st.base[k].thigh.add(dist(s.hip, s.knee)); }
        return;
      }
      if (phase !== 'run') return;
      st.el = (t - st.t0) / 1000;
      st.sway.add(lm);
      for (const k of ['L','R']){
        const b = st.b[k]; if (!b.knee || !b.thigh) continue;
        const lift = (b.knee - P(lm, SIDE[k].knee).y) / b.thigh;
        const a = deg(Math.acos(clamp(1 - lift, -1, 1)));
        const L = st.leg[k];
        if (!L.up && lift > 0.12){ L.up = true; L.peak = a; }
        if (L.up){ L.peak = Math.max(L.peak, a); if (lift < 0.05){ L.up = false; L.steps.push(L.peak); } }
      }
      if (st.el >= DUR){ api.beep(); api.finish(); return; }
      api.live(`${Math.ceil(DUR - st.el)} s`, `${st.leg.L.steps.length + st.leg.R.steps.length} steps`);
    },
    stop(){ st.running = false; },
    result(){
      const mean = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : 0;
      const n = st.leg.L.steps.length + st.leg.R.steps.length;
      return {stepsL:st.leg.L.steps.length, stepsR:st.leg.R.steps.length, liftL:mean(st.leg.L.steps), liftR:mean(st.leg.R.steps),
              cadence: st.el > 1 ? Math.round(n / (st.el / 60)) : 0, range: st.sway.result(st.el).range, seconds: Math.round(st.el), unable: n === 0};
    },
    unable(){ return {stepsL:0, stepsR:0, liftL:0, liftR:0, cadence:0, range:0, unable:true}; }
  };
}

/* 180° turn: body width narrows as they pass side-on, then widens again once facing away */
function turnController(){
  const width = lm => shoulderW(lm) + hipW(lm);
  const st = {wb:Baseline(), ank:{27:Baseline(), 28:Baseline()}, leg:Baseline(), b:{}, r:null, t0:0, tStart:null, dipped:false,
              backSince:null, tEnd:null, steps:0, up:{27:false, 28:false}, manual:false, running:false};
  return {
    begin(lm, t){ st.t0 = t; st.running = true; st.b = {w:st.wb.get() || (lm ? width(lm) : null), 27:st.ank[27].get(), 28:st.ank[28].get(), leg:st.leg.get()}; },
    frame(lm, t, api, phase){
      if (!lm) return;
      if (phase === 'setup' || phase === 'countdown'){
        st.wb.add(width(lm)); st.ank[27].add(P(lm, 27).y); st.ank[28].add(P(lm, 28).y); st.leg.add(dist(P(lm, 23), P(lm, 27)));
        return;
      }
      if (phase !== 'run' || !st.b.w) return;
      const el = (t - st.t0) / 1000;
      st.r = ema(st.r, width(lm) / st.b.w, 0.5);
      if (st.tStart == null && st.r < 0.9) st.tStart = t;
      if (st.r < 0.6) st.dipped = true;
      if (st.tStart != null){
        for (const i of [27, 28]){
          const lift = (st.b[i] - P(lm, i).y) / (st.b.leg || 1);
          if (!st.up[i] && lift > 0.04){ st.up[i] = true; st.steps++; }
          if (st.up[i] && lift < 0.015) st.up[i] = false;
        }
      }
      if (st.dipped && st.r > 0.8){
        if (st.backSince == null) st.backSince = t;
        else if (t - st.backSince > 400){ st.tEnd = st.backSince; st.steps = Math.max(st.steps, 1); api.beep(); api.finish(); return; }
      } else st.backSince = null;
      if (el > 15){ api.finish(); return; }
      api.live(st.tStart ? `${((t - st.tStart) / 1000).toFixed(1)} s` : '0.0 s', st.tStart ? `${st.steps} step${st.steps === 1 ? '' : 's'}` : 'Turn around when ready');
    },
    stop(t, manual){
      if (manual && st.tEnd == null && st.running){ st.tEnd = t; st.manual = true; if (st.tStart == null) st.tStart = st.t0; }
      st.running = false;
    },
    result(){
      const done = st.tEnd != null && st.tStart != null;
      return {time: done ? r1((st.tEnd - st.tStart) / 1000) : 0, steps: st.steps, completed: done, manual: st.manual, unable: !done};
    },
    unable(){ return {time:0, steps:0, completed:false, unable:true}; }
  };
}

/* Standing posture: 5-second still hold, front or side */
function postureController(view){
  const DUR = 5;
  const st = {t0:0, sums:{}, n:0, k:'L', facing:1, running:false};
  const add = (m) => { for (const key in m) st.sums[key] = (st.sums[key] || 0) + m[key]; st.n++; };
  return {
    begin(lm, t){ st.t0 = t; st.running = true; if (lm && view === 'side'){ st.k = bestSide(lm); st.facing = facingOf(lm, st.k); } },
    frame(lm, t, api, phase){
      if (phase !== 'run' || !lm) return;
      const el = (t - st.t0) / 1000;
      if (view === 'front'){
        const sw = shoulderW(lm) || 1;
        add({shoulder: tilt(P(lm, 11), P(lm, 12)), pelvis: tilt(P(lm, 23), P(lm, 24)),
             shift: Math.abs(shMid(lm).x - hipMid(lm).x) / sw * 100, head: tilt(P(lm, 7), P(lm, 8))});
      } else {
        const s = pts(lm, st.k);
        add({head: lean(s.ear, s.sh, st.facing), trunk: lean(s.sh, s.hip, st.facing), hip: lean(s.hip, s.ank, st.facing)});
      }
      if (el >= DUR){ api.beep(); api.finish(); return; }
      api.live(`${Math.ceil(DUR - el)} s`, 'Hold still');
    },
    stop(){ st.running = false; },
    result(){
      if (!st.n) return {unable:true};
      const o = {}; for (const key in st.sums) o[key] = Math.round(st.sums[key] / st.n);
      return o;
    },
    unable(){ return {unable:true}; }
  };
}

/* Floor-to-stand: standing → sitting on the floor → standing */
function floorController(){
  const st = {base:Baseline(), H0:null, t0:0, phase:'down', tFloor:null, time:null, v:null, running:false};
  const height = lm => ankMid(lm).y - hipMid(lm).y;
  return {
    begin(lm, t){ st.t0 = t; st.running = true; st.H0 = st.base.get() || (lm ? height(lm) : null); },
    frame(lm, t, api, phase){
      if (!lm) return;
      if (phase === 'setup' || phase === 'countdown'){ st.base.add(height(lm)); return; }
      if (phase !== 'run' || !st.H0) return;
      const el = (t - st.t0) / 1000;
      st.v = ema(st.v, height(lm) / st.H0, 0.5);
      if (st.phase === 'down' && st.v < 0.3){ st.phase = 'up'; st.tFloor = t; api.beep(); }
      else if (st.phase === 'up' && st.v > 0.85){ st.time = el; api.beep(); api.finish(); return; }
      if (el > 90){ api.finish(); return; }
      api.live(`${el.toFixed(1)} s`, st.phase === 'down' ? 'Sit down on the floor' : 'Now stand back up');
    },
    stop(){ st.running = false; },
    result(){
      return {time: st.time != null ? r1(st.time) : 0, down: st.tFloor ? r1((st.tFloor - st.t0) / 1000) : null,
              completed: st.time != null, unable: st.time == null};
    },
    unable(){ return {time:0, completed:false, unable:true}; }
  };
}

/* ---------- Rep-based test configurations ---------- */
function squatCfg(){
  return {
    target:3, down:0.15, up:0.07, upText:'Standing – squat when ready',
    setup(lm, ctx){ ctx.k = bestSide(lm); ctx.facing = facingOf(lm, ctx.k); ctx.heel = ctx.heel || Baseline(); ctx.heel.add(this.heelRel(lm, ctx.k)); },
    begin(ctx, lm){ if (!ctx.k && lm){ ctx.k = bestSide(lm); ctx.facing = facingOf(lm, ctx.k); } ctx.heel0 = ctx.heel?.get() ?? 0; },
    heelRel(lm, k){ const s = pts(lm, k); return (s.toe.y - s.heel.y) / (dist(s.hip, s.ank) || 1); },
    signal(lm){ return 1 - legExt(lm, bestSide(lm)); },
    metrics(lm, ctx){
      const k = bestSide(lm), s = pts(lm, k), f = ctx.facing || 1;
      return { thigh: deg(Math.atan2(s.knee.y - s.hip.y, Math.abs(s.knee.x - s.hip.x))), trunk: fromVertical(s.sh, s.hip),
               tibia: fromVertical(s.knee, s.ank), arm: deg(Math.atan2((s.wr.x - s.sh.x) * f, s.sh.y - s.wr.y)), knee: ang(s.hip, s.knee, s.ank) };
    },
    during(lm, cur, ctx){ cur.heelMax = Math.max(cur.heelMax ?? -1, this.heelRel(lm, bestSide(lm))); },
    faults(r, ctx){
      const f = [];
      if (r.thigh > 0) f.push('Hips stayed above knee height');
      if (r.trunk > r.tibia + 10) f.push('Trunk leaned further forward than the shins');
      if (r.arm > 25) f.push('Arms or dowel drifted forward');
      if ((r.heelMax ?? 0) - (ctx.heel0 ?? 0) > 0.04) f.push('Heels lifted');
      return f;
    }
  };
}
function hingeCfg(){
  return {
    target:3, down:35, up:18, upText:'Standing – hinge when ready', downText:'Hinging…',
    setup(lm, ctx){ ctx.k = bestSide(lm); ctx.facing = facingOf(lm, ctx.k); },
    signal(lm){ const s = pts(lm, bestSide(lm)); return fromVertical(s.sh, s.hip); },
    metrics(lm, ctx){
      const s = pts(lm, bestSide(lm)), f = ctx.facing || 1;
      return { trunk: fromVertical(s.sh, s.hip), knee: ang(s.hip, s.knee, s.ank), hipBack: (s.ank.x - s.hip.x) * f / (dist(s.hip, s.ank) || 1) };
    },
    faults(r){
      const f = [];
      if (r.trunk < 50) f.push('Limited hinge – trunk stayed fairly upright');
      if (r.knee < 140) f.push('Knees bent too much (squatting rather than hinging)');
      if (r.hipBack < 0.08) f.push('Hips didn’t shift back');
      return f;
    }
  };
}
function frontRepCfg(stance, opts){
  return {
    target: opts.target, down: opts.down, up: opts.up, downText: opts.downText, upText: opts.upText,
    setup(lm, ctx){
      ctx.hb = ctx.hb || Baseline(); ctx.lb = ctx.lb || Baseline();
      ctx.hb.add(hipMid(lm).y); const s = pts(lm, stance); ctx.lb.add(dist(s.hip, s.knee) + dist(s.knee, s.ank));
    },
    begin(ctx, lm){ ctx.base = ctx.hb?.get(); ctx.leg = ctx.lb?.get(); if (!ctx.base && lm){ ctx.base = hipMid(lm).y; const s = pts(lm, stance); ctx.leg = dist(s.hip, s.knee) + dist(s.knee, s.ank); } },
    signal(lm, ctx){ return ctx.base && ctx.leg ? (hipMid(lm).y - ctx.base) / ctx.leg : NaN; },
    track(lm, v, ctx, state){ if (state === 'up' && v < opts.up) ctx.base += 0.03 * (hipMid(lm).y - ctx.base); },
    metrics(lm){ return {knee: kneeInward(lm, stance), pelvis: pelvisDrop(lm, stance), trunk: trunkSideLean(lm)}; },
    faults: opts.faults
  };
}

/* ============================================================
   Norms and scoring helpers
   ============================================================ */
const NORM = {
  sts: age => age >= 60 ? 14.2 : 10.0,                                                      // Whitney et al. 2005 cut-offs (ESSA booklet)
  bal: age => age >= 80 ? 6.2 : age >= 70 ? 14.2 : age >= 60 ? 22.5 : age >= 50 ? 36.0 : age >= 40 ? 40.4 : 43.5, // 60-79: Bohannon 1984 (ESSA booklet); other ages Springer 2007
  reach: age => age >= 70 ? 30 : age >= 41 ? 36 : 40                                       // Duncan 1990, men/women averaged
};
const balTarget = age => Math.min(NORM.bal(age), BAL_MAX);
const faultScore = n => n === 0 ? 3 : n === 1 ? 2 : 1;
function majorityFaults(reps){
  const counts = {};
  reps.forEach(r => r.faults.forEach(f => counts[f] = (counts[f] || 0) + 1));
  return Object.keys(counts).filter(f => counts[f] >= Math.ceil(reps.length / 2));
}
function bestRep(reps){ return [...reps].sort((a,b) => a.faults.length - b.faults.length)[0] || null; }
const lrMin = (r, fn) => (!r || !r.L || !r.R) ? null : Math.min(fn(r.L), fn(r.R));
function asym(a, b, pctThreshold, label){
  const mx = Math.max(a, b); if (!(mx > 0)) return null;
  const pct = Math.abs(a - b) / mx * 100;
  return pct > pctThreshold ? {t:`${label}: left/right difference of ${Math.round(pct)}%`} : null;
}
const legName = t => t === 'L' ? 'Left' : 'Right';
const repWord = n => `${n} rep${n === 1 ? '' : 's'}`;
function repSummary(side, label){
  if (!side) return `${label}: not done`;
  if (side.unable || !side.reps.length) return `${label}: unable`;
  const f = majorityFaults(side.reps);
  return `${label}: ${repWord(side.reps.length)}, ${f.length ? f.join('; ').toLowerCase() : 'no faults'}`;
}
const repSideScore = x => (!x || x.unable || !x.reps.length) ? 0 : faultScore(majorityFaults(x.reps).length);
const peakSide = (x, fmt) => !x ? 'not done' : x.unable ? 'unable' : fmt(x);

/* ---------- Percentage per movement ----------

/* ============================================================

const GRIP_YOUNG = {male:51, female:31};

  male:   {R:[26.0,26.7,26.4,26.1,25.6,25.8,26.7,24.2,23.2,23.4,19.3,20.5], L:[24.8,25.0,26.2,25.6,25.1,24.8,26.1,23.0,22.2,22.0,19.2,19.1]},
  female: {R:[17.6,17.7,18.7,16.6,16.7,17.6,16.7,15.7,15.5,15.0,14.5,12.6], L:[16.2,16.6,17.8,16.0,15.8,16.6,16.1,14.7,14.1,14.3,13.8,11.4]}

  sh_er:    {male:[26.2,23.6,22.0,18.7,18.1,18.4], female:[17.8,17.4,19.0,17.4,14.3,13.8]},
  ank_df:   {male:[48.0,48.5,44.6,36.8,34.3,32.4], female:[49.4,39.2,41.3,40.2,38.4,27.9]},
  knee_ext: {male:[73.9,73.7,70.2,55.4,48.3,48.1], female:[73.9,63.6,61.2,52.5,44.0,36.2]},

    const g = refTarget(t, c, w);
    lines.push(g ? `Target for age${c.sex ? ' and gender' : ''}: ${g} kg (${Math.round(g / w * 100)}% of body weight)` : 'Target set by age, gender and body weight');
    if (t.refNote) lines.push(t.refNote);
    if (!w) flags.push({t:'Add body weight to score against the target – scored on left/right symmetry for now'});
    else if (!c.sex) flags.push({t:'Add the client’s gender for an accurate target'});
  } else if (t.symOnly){
    lines.push('Scored on left/right symmetry – hand-held readings for this test aren’t reliable enough to compare with a target');
  } else if (t.bw){
    lines.push(w ? `Target ${tgtText(t)} (${r1(t.bw * w)} kg)` : `Target ${tgtText(t)}`);
    if (!w) flags.push({t:'Add body weight to score against the target – scored on left/right symmetry for now'});
  }
  return {lines, flags};
}

/* ---------- Bluetooth device manager ---------- */
const devs = {};   // kind -> {device, char, battery, last, listeners:Set}
const devState = kind => devs[kind] || (devs[kind] = {listeners:new Set()});
const devConnected = kind => !!devs[kind]?.device?.gatt?.connected;
function onDevData(kind, dv){
  const b = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
  if (b.length < (kind === 'anchor' ? 4 : 2)) return;
  const rd = o => Math.abs(((b[o] << 8) | b[o + 1]) << 16 >> 16) / 10;   // signed 16-bit, tenths of kg
  const s = kind === 'anchor' ? {l: rd(0), r: rd(2)} : {v: rd(0)};
  s.t = performance.now();
  const st = devState(kind); st.last = s;
  st.listeners.forEach(fn => fn(s));
}
const DYNO_SERVICE = 0xffe0, DYNO_DATA = 0xffe1, DYNO_IDS = 'bep_dyno_ids';
/* Names of dynos connected before, so the normal list can find them even if they don't announce the force service */
const DYNO_NAMES = 'bep_dyno_names';
const savedDynoNames = () => { try { return JSON.parse(localStorage.getItem(DYNO_NAMES)) || {}; } catch(e){ return {}; } };
const savedDynoIds = () => { try { return JSON.parse(localStorage.getItem(DYNO_IDS)) || {}; } catch(e){ return {}; } };
function forgetDev(kind){
  const st = devState(kind); st.device = null; st.char = null;
  try { const ids = savedDynoIds(); delete ids[kind]; localStorage.setItem(DYNO_IDS, JSON.stringify(ids)); } catch(e){}
}
async function connectDev(kind, showAll = false){
  if (!navigator.bluetooth) throw new Error('Bluetooth needs Chrome or Edge on this computer');
  const st = devState(kind);
  if (showAll) forgetDev(kind);
  let remembered = false;
  if (!st.device){
    // Reuse the device picked for this slot last time, if the browser still remembers it
    const id = savedDynoIds()[kind];
    if (id && navigator.bluetooth.getDevices){
      try { st.device = (await navigator.bluetooth.getDevices()).find(d => d.id === id) || null; remembered = !!st.device; } catch(e){}
    }
    // Otherwise ask, matching on the force-data service rather than any device name
    // "Show all" lists every Bluetooth device, for a dyno that doesn't announce its force service
    if (!st.device){
      const names = [...new Set(Object.values(savedDynoNames()).filter(n => typeof n === 'string' && n && n !== '*'))];
      const noName = savedDynoNames()[kind] === '*';
      st.device = await navigator.bluetooth.requestDevice(showAll || noName
        ? {acceptAllDevices:true, optionalServices:[DYNO_SERVICE, 'battery_service']}
        : {filters:[{services:[DYNO_SERVICE]}, ...names.map(name => ({name}))], optionalServices:[DYNO_SERVICE, 'battery_service']});
    }
    st.device.addEventListener('gattserverdisconnected', () => st.listeners.forEach(fn => fn(null)));
    try { localStorage.setItem(DYNO_IDS, JSON.stringify({...savedDynoIds(), [kind]: st.device.id})); } catch(e){}
  }
  let server, ch;
  try {
    server = await st.device.gatt.connect();
    ch = await (await server.getPrimaryService(DYNO_SERVICE)).getCharacteristic(DYNO_DATA);
  } catch(e){
    // A remembered dyno that won't answer (off, asleep, or held by another tab or tablet): forget it so the next press shows the list
    forgetDev(kind);
    if (remembered){ const err = new Error('The dyno used last time didn’t respond. Wake it (press its button), then press Connect again to pick it from the list.'); err.name = 'RetryError'; throw err; }
    throw new Error(/service/i.test(e.message) ? 'That device isn’t a dyno. Press Connect and choose the dyno.' : e.message);
  }
  try { localStorage.setItem(DYNO_NAMES, JSON.stringify({...savedDynoNames(), [kind]: st.device.name || '*'})); } catch(e){}
  if (!ch._bep){ ch._bep = true; ch.addEventListener('characteristicvaluechanged', e => onDevData(kind, e.target.value)); }
  await ch.startNotifications();
  st.char = ch;
  try { st.battery = (await (await (await server.getPrimaryService('battery_service')).getCharacteristic('battery_level')).readValue()).getUint8(0); } catch(e){ st.battery = null; }
  st.listeners.forEach(fn => fn(st.last || null));
  return st;
}

    const tests = [...app.querySelectorAll('.plan-item input:checked')].map(i => i.value);
    if (!name){ toast('Give the template a name.', true); return; }
    if (!tests.length){ toast('Tick at least one test.', true); return; }
    if (tid){ Object.assign(tpl, {name, tests}); } else { templates().push({id:uid(), name, tests, created:new Date().toISOString()}); }

  };

    db.templates = templates().filter(t => t.id !== tid); saveDB(); go(renderTemplates);
  };
}

function startFromTemplate(cid, tpl){
  const c = getClient(cid); if (!c || !tpl) return;
  const now = new Date().toISOString(); let first = null, made = 0;
  for (const x of TPL_TYPES){
    const ids = tplTests(tpl, x.type).map(t => t.id);
    if (!ids.length) continue;
    const s = {id:uid(), type:x.type, date:now, status:'in-progress', results:{}, notes:'', plan:ids, from:tpl.name};

    c.sessions.push(s); made++; first = first || s;
  }
  if (!made){ toast('That template has no tests.', true); return; }
  if (saveDB()){ toast(`${made} screen${made === 1 ? '' : 's'} created from “${tpl.name}”.`); go(renderSession, cid, first.id); }
}

/* ---------- Live strength test (attempts detected automatically) ---------- */
/* Watches the force stream: starts recording when force rises 2 kg above the resting level,
   stops when it drops below 30% of the peak for 0.6 s. Efforts under 3 kg or 0.4 s are ignored. */
function makeDetector(both, on){
  const val = s => both ? s.l + s.r : s.v;
  const med = a => { const b = [...a].sort((x, y) => x - y); return b.length ? b[Math.floor(b.length / 2)] : 0; };
  let state = 'rest', rest = [], pre = [], rec = [], base = both ? {l:0, r:0} : {v:0}, lowSince = null, coolUntil = 0, peak = 0;
  const baseTotal = () => both ? base.l + base.r : base.v;
  function end(t){
    const t0 = rec[0].t, dur = t - t0;
    const series = rec.map(x => both ? {t:x.t - t0, l:Math.max(0, x.l - base.l), r:Math.max(0, x.r - base.r)} : {t:x.t - t0, v:Math.max(0, x.v - base.v)});
    state = 'cool'; coolUntil = t + 800; rest = []; pre = [];
    if (peak >= 3 && dur >= 400) on.attempt(series); else on.discard?.();
  }
  return {
    get state(){ return state; }, get base(){ return base; },
    reset(){ state = 'rest'; rest = []; pre = []; rec = []; },
    push(s){
      const t = s.t;
      if (state === 'cool'){ if (t < coolUntil) return; state = 'rest'; }
      if (state === 'rest'){
        rest.push(s); while (rest.length && t - rest[0].t > 1500) rest.shift();
        const b = both ? {l:med(rest.map(x => x.l)), r:med(rest.map(x => x.r))} : {v:med(rest.map(x => x.v))};
        base = (both ? b.l + b.r : b.v) < 5 ? b : (both ? {l:0, r:0} : {v:0});
        pre.push(s); if (pre.length > 12) pre.shift();
        if (val(s) - baseTotal() <= 2) return;
        state = 'rec'; rec = pre.slice(); peak = 0; lowSince = null; on.start?.();
      } else rec.push(s);
      const cur = val(s) - baseTotal(); peak = Math.max(peak, cur);
      on.progress?.(rec.map(x => both ? {t:x.t - rec[0].t, l:Math.max(0, x.l - base.l), r:Math.max(0, x.r - base.r)} : {t:x.t - rec[0].t, v:Math.max(0, x.v - base.v)}));
      if (cur < Math.max(1.5, peak * 0.3)){ if (lowSince == null) lowSince = t; else if (t - lowSince > 600) return end(t); }
      else lowSince = null;
      if (t - rec[0].t > 10000) end(t);
    }
  };
}

function renderStrengthTest(cid, sid, testId){
  const c = getClient(cid), s = getSession(c, sid), t = STRENGTH.find(x => x.id === testId);
  if (!s || !t) return go(renderSession, cid, sid);
  const kind = t.device, dev = DEVICE_INFO[kind], both = t.sides === 'both', sided = t.sides === 'LR';
  const prevR = s.results[t.id] && !s.results[t.id].unable ? JSON.parse(JSON.stringify(s.results[t.id])) : null;
  const data = sided ? {L:{attempts: prevR?.L?.attempts || []}, R:{attempts: prevR?.R?.attempts || []}} : {attempts: prevR?.attempts || []};
  let side = 'L', lastTrace = null, dirty = false;
  const atts = () => sided ? data[side].attempts : data.attempts;

  app.innerHTML = shell(`
    <section class="hero st-hero">
      <p class="eyebrow">${esc(c.name)}, strength screen</p>
      <h1>${esc(t.name)}</h1>
      <div class="devline"><span class="devdot" id="devDot"></span><span id="devStatus"></span><button class="btn sky small" id="devBtn"></button><button class="link" id="devAll">Dyno not in the list?</button></div>
    </section>
    <div class="st-grid">
      <section class="card st-live">
        ${sided ? `<div class="seg" role="tablist"><button role="tab" data-side="L">Left</button><button role="tab" data-side="R">Right</button></div>` : ''}
        <p class="st-state" id="stState" aria-live="polite"></p>
        <div class="st-read ${both ? 'two' : ''}">
          ${both ? `<div><span class="st-lab">Left</span><b id="liveL">0.0</b><span class="st-unit">kg</span></div>
                    <div><span class="st-lab">Right</span><b id="liveR">0.0</b><span class="st-unit">kg</span></div>`
                 : `<div><span class="st-lab" id="liveLab">${sided ? 'Left' : 'Force'}</span><b id="liveV">0.0</b><span class="st-unit">kg</span></div>`}
        </div>
        <canvas id="stChart" width="1000" height="260" aria-label="Force over time"></canvas>
        <details class="manual"><summary>No device? Type the peak instead</summary>
          <div class="row">
            ${both ? `<div class="field"><label for="manL">Left (kg)</label><input id="manL" type="number" step="0.1" inputmode="decimal"></div>
                      <div class="field"><label for="manR">Right (kg)</label><input id="manR" type="number" step="0.1" inputmode="decimal"></div>`
                   : `<div class="field"><label for="manV">Peak (kg)</label><input id="manV" type="number" step="0.1" inputmode="decimal"></div>`}
            <button class="btn quiet small" id="manAdd">Add attempt</button>
          </div>
        </details>
      </section>
      <aside class="card"><h2>How to test</h2><ol class="steps">${t.steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol>
        <p class="note" style="margin-top:.9rem">Attempts record themselves: the app starts when the client pushes and saves the attempt when they relax.</p></aside>
    </div>
    <section class="card"><div class="card-head"><h2>Attempts</h2><span class="row-meta" id="attSide"></span></div><div id="attempts"></div></section>
    <div class="btn-row end-row next-row">
      <button class="btn big-next" id="nextBtn"></button>
      <button class="btn quiet" id="saveBack">Save and back to screen</button>
      <button class="btn quiet" id="unable">Client unable</button>
    </div>`, 'Back to screen');
  bindShell();
  const $ = id => document.getElementById(id);

  /* device status */
  function devUI(){
    const on = devConnected(kind), st = devs[kind];
    $('devDot').classList.toggle('on', on);
    $('devStatus').textContent = !navigator.bluetooth ? 'Bluetooth needs Chrome or Edge – type the peaks below instead.'
      : on ? `${dev.label} connected${st?.battery != null ? `, battery ${st.battery}%` : ''}` : `${dev.label} not connected`;
    $('devBtn').textContent = on ? 'Reconnect' : `Connect ${dev.label.toLowerCase()}`;
    $('devBtn').hidden = !navigator.bluetooth;
    $('devAll').hidden = !navigator.bluetooth || on;
    stateUI();
  }
  const doConnect = async showAll => {
    $('devBtn').disabled = $('devAll').disabled = true; $('devStatus').textContent = `Connecting – choose the ${dev.label.toLowerCase()} from the list…`;
    try { await connectDev(kind, showAll); }
    catch(e){
      if (e.name === 'RetryError') toast(e.message, true);
      else if (e.name !== 'NotFoundError') toast(`Couldn’t connect: ${e.message}`, true);
      else if (!showAll) toast('No dyno chosen. If it wasn’t in the list, wake it, close other tabs with this app, check it isn’t connected to the iPad or a phone, then try “Dyno not in the list?”.');
    }
    $('devBtn').disabled = $('devAll').disabled = false; devUI();
  };
  $('devBtn').onclick = () => doConnect(false);
  $('devAll').onclick = () => doConnect(true);
  function stateUI(msg){
    const el = $('stState'); if (!el) return;
    const rec = det.state === 'rec';
    el.classList.toggle('rec', rec);
    el.textContent = msg || (!devConnected(kind) ? 'Connect the device to start – or type the peaks below.'
      : rec ? 'Recording…' : `Ready – ${sided ? `${side === 'L' ? 'left' : 'right'} side, ` : ''}attempt ${atts().length + 1}. Start whenever the client is ready.`);
  }

  /* automatic attempt detection */
  const det = makeDetector(both, {
    start(){ unlockAudio(); beep(880, 0.08); keepAwake(true); stateUI(); },
    progress(series){ drawChart(series); },
    discard(){ stateUI(); },
    attempt(series){
      let a;
      if (both){
        const L = metrics(series.map(x => ({t:x.t, v:x.l}))), R = metrics(series.map(x => ({t:x.t, v:x.r})));
        a = {peakL:L.peak, peakR:R.peak, ttpL:L.ttp, ttpR:R.ttp, rfdL:L.rfd, rfdR:R.rfd, trace: thin(series).map(x => [Math.round(x.t), r1(x.l), r1(x.r)])};
      } else {
        const m = metrics(series); a = {...m, trace: thin(series).map(x => [Math.round(x.t), r1(x.v)])};
      }
      atts().push(a); dirty = true; lastTrace = series; beep(660, 0.25); keepAwake(false);
      renderAttempts();
      stateUI(`Attempt ${atts().length} saved${both ? `: left ${a.peakL.toFixed(1)} kg, right ${a.peakR.toFixed(1)} kg` : `: ${a.peak.toFixed(1)} kg`}. Rest, then go again – or press Next.`);
    }
  });
  const fmt = v => Math.max(0, v).toFixed(1);
  const listener = sm => {
    if (!sm){ det.reset(); devUI(); return; }
    const b = det.base;
    if (both){ $('liveL').textContent = fmt(sm.l - b.l); $('liveR').textContent = fmt(sm.r - b.r); }
    else $('liveV').textContent = fmt(sm.v - b.v);
    det.push(sm);
  };
  devState(kind).listeners.add(listener);

  function metrics(series){
    const peak = Math.max(0, ...series.map(x => x.v));
    if (!(peak > 0)) return {peak:0, ttp:null, rfd:null};
    const on = series.find(x => x.v >= Math.max(0.5, peak * 0.05)), atPeak = series.find(x => x.v >= peak);
    const t20 = series.find(x => x.v >= peak * 0.2), t80 = series.find(x => x.v >= peak * 0.8);
    return {peak: r1(peak), ttp: on && atPeak ? r1((atPeak.t - on.t) / 1000) : null,
            rfd: t20 && t80 && t80.t > t20.t ? Math.round((peak * 0.6) / ((t80.t - t20.t) / 1000)) : null};
  }
  const thin = (arr, n = 60) => arr.length <= n ? arr : arr.filter((_, i) => i % Math.ceil(arr.length / n) === 0);

  $('manAdd').onclick = () => {
    if (both){
      const l = parseFloat($('manL').value), r = parseFloat($('manR').value);
      if (!Number.isFinite(l) && !Number.isFinite(r)){ toast('Type the left and/or right peak.', true); return; }
      atts().push({peakL: r1(l || 0), peakR: r1(r || 0), manual:true}); $('manL').value = ''; $('manR').value = '';
    } else {
      const v = parseFloat($('manV').value);
      if (!Number.isFinite(v)){ toast('Type the peak shown on the device.', true); return; }
      atts().push({peak: r1(v), manual:true}); $('manV').value = '';
    }
    dirty = true; renderAttempts(); stateUI();
  };

  /* chart */
  function drawChart(series){
    const cv = $('stChart'); if (!cv) return;
    const x = cv.getContext('2d'), W = cv.width, H = cv.height;
    x.clearRect(0, 0, W, H);
    const best = both ? Math.max(bestOf(atts(), 'peakL') || 0, bestOf(atts(), 'peakR') || 0) : (bestOf(atts()) || 0);
    const vals = series.flatMap(p => both ? [p.l, p.r] : [p.v]);
    const top = Math.max(10, best * 1.15, ...vals.map(v => v * 1.15));
    const span = Math.max(6000, ...series.map(p => p.t + 500));
    const X = tt => (tt / span) * W, Y = v => H - 12 - (v / top) * (H - 30);
    x.strokeStyle = 'rgba(0,114,141,.14)'; x.lineWidth = 1; x.font = '20px sans-serif'; x.fillStyle = '#565D61';
    for (let i = 0; i <= 4; i++){ const v = top * i / 4, yy = Y(v); x.beginPath(); x.moveTo(0, yy); x.lineTo(W, yy); x.stroke(); if (i) x.fillText(`${Math.round(v)} kg`, 8, yy - 4); }
    if (best > 0){ x.setLineDash([10, 8]); x.strokeStyle = '#00728D'; x.beginPath(); x.moveTo(0, Y(best)); x.lineTo(W, Y(best)); x.stroke(); x.setLineDash([]); x.fillStyle = '#00728D'; x.fillText(`Best ${best.toFixed(1)} kg`, W - 170, Y(best) - 6); }
    const line = (key, col) => { x.strokeStyle = col; x.lineWidth = 5; x.lineJoin = 'round'; x.beginPath(); series.forEach((p, i) => i ? x.lineTo(X(p.t), Y(p[key])) : x.moveTo(X(p.t), Y(p[key]))); x.stroke(); };
    if (series.length > 1){ if (both){ line('l', '#2FB3D6'); line('r', '#111111'); } else line('v', '#00728D'); }
  }

  /* attempts table */
  function renderAttempts(){
    const a = atts();
    $('attSide').textContent = sided ? `${side === 'L' ? 'Left' : 'Right'} side` : both ? 'Left and right' : '';
    if (!a.length){ $('attempts').innerHTML = '<p class="empty">No attempts yet – they’ll appear here as the client performs them.</p>'; drawChart(lastTrace || []); nextUI(); return; }
    const bestV = both ? null : bestOf(a);
    $('attempts').innerHTML = `<table class="att"><thead><tr><th>#</th>${both ? '<th>Left</th><th>Right</th><th>Symmetry</th>' : '<th>Peak</th>'}<th>Time to peak</th><th>Rate of force</th><th></th></tr></thead><tbody>
      ${a.map((x, i) => `<tr${!both && x.peak === bestV ? ' class="best"' : ''}><td>${i + 1}</td>
        ${both ? `<td>${x.peakL.toFixed(1)} kg</td><td>${x.peakR.toFixed(1)} kg</td><td>${symmetry(x.peakL, x.peakR) != null ? symmetry(x.peakL, x.peakR) + '%' : '–'}</td>`
               : `<td><b>${x.peak.toFixed(1)} kg</b>${x.peak === bestV ? ' <span class="tag">Best</span>' : ''}</td>`}
        <td>${x.manual ? 'Typed in' : (both ? (x.ttpL ?? x.ttpR) : x.ttp) != null ? `${both ? (x.ttpL ?? x.ttpR) : x.ttp} s` : '–'}</td>
        <td>${!x.manual && (both ? x.rfdL : x.rfd) != null ? `${both ? `${x.rfdL} / ${x.rfdR}` : x.rfd} kg/s` : '–'}</td>
        <td><button class="link" data-del="${i}" aria-label="Delete attempt ${i + 1}">Delete</button></td></tr>`).join('')}
      </tbody></table>`;
    $('attempts').querySelectorAll('[data-del]').forEach(b => b.onclick = () => { a.splice(+b.dataset.del, 1); dirty = true; renderAttempts(); stateUI(); });
    const lt = a[a.length - 1]?.trace;
    if (lastTrace) drawChart(lastTrace); else if (lt) drawChart(lt.map(p => both ? {t:p[0], l:p[1], r:p[2]} : {t:p[0], v:p[1]}));
    nextUI();
  }
  function setSide(k){
    side = k; lastTrace = null; det.reset();
    app.querySelectorAll('[data-side]').forEach(b => { b.classList.toggle('on', b.dataset.side === k); b.setAttribute('aria-selected', b.dataset.side === k); });
    if ($('liveLab')) $('liveLab').textContent = k === 'L' ? 'Left' : 'Right';
    renderAttempts(); stateUI();
  }
  app.querySelectorAll('[data-side]').forEach(b => b.onclick = () => { if (det.state !== 'rec') setSide(b.dataset.side); });

  /* next / save */
  function nextId(){
    const list = plannedTests(s), i = list.findIndex(x => x.id === t.id);
    return list.slice(i + 1).find(x => !s.results[x.id])?.id || null;   // forward only, so skipped tests aren't repeated
  }
  function nextUI(){
    const n = nextId();
    $('nextBtn').textContent = sided && side === 'L' ? 'Next: right side' : n ? `Next: ${STRENGTH.find(x => x.id === n).name.toLowerCase()}` : 'Finish and back to screen';
  }
  const hasAny = () => sided ? data.L.attempts.length || data.R.attempts.length : data.attempts.length;
  function save(){
    if (!hasAny()) return true;   // nothing recorded – leave any earlier result as it was
    s.results[t.id] = {...JSON.parse(JSON.stringify(data)), weight: s.weight || c.weight || null, overridePct:null, at:new Date().toISOString()};
    dirty = false; return saveDB();
  }
  $('nextBtn').onclick = () => {
    if (det.state === 'rec'){ toast('Wait for the attempt to finish.'); return; }
    if (sided && side === 'L'){
      if (!data.L.attempts.length && !confirm('No attempts on the left side. Move to the right anyway?')) return;
      setSide('R'); return;
    }
    if (!hasAny() && !confirm('No attempts recorded for this test. Skip it?')) return;
    if (!save()) return;
    const n = nextId(); n ? go(renderTest, cid, sid, n) : go(renderSession, cid, sid);
  };
  $('saveBack').onclick = () => { if (save()) go(renderSession, cid, sid); };
  $('unable').onclick = () => { if (!confirm('Record this test as unable to complete?')) return; s.results[t.id] = {unable:true, overridePct:null, at:new Date().toISOString()}; if (saveDB()) go(renderSession, cid, sid); };
  $('back').onclick = () => { if (dirty && !confirm('Leave without saving these attempts?')) return; go(renderSession, cid, sid); };
  const onKey = e => {
    if (e.target.closest && e.target.closest('input, select, textarea, summary, button')) return;
    if (e.key === 'Enter'){ e.preventDefault(); $('nextBtn').click(); }
  };
  document.addEventListener('keydown', onKey);
  cleanup = () => { devState(kind).listeners.delete(listener); document.removeEventListener('keydown', onKey); keepAwake(false); };

  devUI();
  if (sided) setSide(data.L.attempts.length && !data.R.attempts.length ? 'R' : 'L'); else renderAttempts();
  stateUI();
}

/* ============================================================

const BF_AGE = a => a <= 25 ? 0 : a <= 35 ? 1 : a <= 45 ? 2 : a <= 55 ? 3 : a <= 65 ? 4 : 5;

  male:   [[7,12,14,16,18,18],[10,15,18,20,21,21],[13,18,21,23,24,23],[16,21,24,25,26,25],[20,24,26,28,28,27],[26,28,29,31,31,30]],

function bindHealthForm(c, s, refresh){

const els = {video: document.createElement('video'), canvas: document.createElement('canvas')};
els.video.playsInline = true; els.video.muted = true; els.video.setAttribute('playsinline',''); els.video.setAttribute('muted','');

const PREFERRED_CAM = /brio|logitech/i;

async function initPose(){
  if (landmarker) return;
  let mod; try { mod = await import(LOCAL.mp); } catch(e){ mod = await import(MP_URL); }
  const { PoseLandmarker, FilesetResolver } = mod;
  const wasmBase = await localOK(LOCAL.wasm + '/vision_wasm_internal.js') ? LOCAL.wasm : WASM_URL;
  const modelPath = await localOK(LOCAL.model) ? LOCAL.model : MODEL_URL;
  const fileset = await FilesetResolver.forVisionTasks(wasmBase);
  const opts = d => ({baseOptions:{modelAssetPath:modelPath, delegate:d}, runningMode:'VIDEO', numPoses:1,
    minPoseDetectionConfidence:0.5, minPosePresenceConfidence:0.5, minTrackingConfidence:0.5});
  try { landmarker = await PoseLandmarker.createFromOptions(fileset, opts('GPU')); }
  catch(e){ landmarker = await PoseLandmarker.createFromOptions(fileset, opts('CPU')); }
}
async function startCamera(){
  stopCamera();
  let saved = null; try { saved = localStorage.getItem(CAM_KEY); } catch(e){}
  const base = {width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:60}};
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:false, video: saved ? {...base, deviceId:{exact:saved}} : {...base, facingMode}});
  } catch(e){
    if (!saved) throw e;
    try { localStorage.removeItem(CAM_KEY); } catch(_){}
    stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{...base, facingMode:'user'}});
  }
  if (!saved){
    const preferred = (await listCameras()).find(d => PREFERRED_CAM.test(d.label));
    const cur = stream.getVideoTracks()[0]?.getSettings?.().deviceId;
    if (preferred && preferred.deviceId && preferred.deviceId !== cur){
      try {
        const s2 = await navigator.mediaDevices.getUserMedia({audio:false, video:{...base, deviceId:{exact:preferred.deviceId}}});
        stream.getTracks().forEach(t => t.stop()); stream = s2;
        try { localStorage.setItem(CAM_KEY, preferred.deviceId); } catch(_){}
      } catch(_){}
    }
  }
  const label = stream.getVideoTracks()[0]?.label || '';
  camMirror = /front/i.test(label);
  els.video.srcObject = stream;
  await els.video.play();
}
function camName(label, i){
  const l = (label || '').replace(/\s*\([0-9a-f]{4}:[0-9a-f]{4}\)/ig, '').trim();
  if (!l) return `Camera ${i + 1}`;

async function listCameras(){

}

const COL = {L:'#83DFF5', R:'#FFFFFF', C:'#B2EBF9'};
const CONN = [[11,12,'C'],[23,24,'C'],[11,23,'L'],[12,24,'R'],[11,13,'L'],[13,15,'L'],[12,14,'R'],[14,16,'R'],
  [23,25,'L'],[25,27,'L'],[27,29,'L'],[29,31,'L'],[27,31,'L'],[24,26,'R'],[26,28,'R'],[28,30,'R'],[30,32,'R'],[28,32,'R']];
function draw(lm){
  const c = els.canvas, v = els.video;
  if (c.width !== v.videoWidth || c.height !== v.videoHeight){ c.width = v.videoWidth; c.height = v.videoHeight; }
  const x = c.getContext('2d'); x.clearRect(0, 0, c.width, c.height);
  if (!lm) return;
  const W = c.width, H = c.height, lw = Math.max(3, W / 200);
  const seg = (a, b) => { const p = lm[a], q = lm[b]; if ((p.visibility ?? 1) < 0.3 || (q.visibility ?? 1) < 0.3) return false; x.beginPath(); x.moveTo(p.x * W, p.y * H); x.lineTo(q.x * W, q.y * H); x.stroke(); return true; };
  x.lineCap = 'round';
  x.strokeStyle = 'rgba(17,17,17,.65)'; x.lineWidth = lw + 4;
  for (const [a, b] of CONN) seg(a, b);
  x.lineWidth = lw;
  for (const [a, b, s] of CONN){ x.strokeStyle = COL[s]; seg(a, b); }
  for (const i of [0,11,12,13,14,15,16,23,24,25,26,27,28]){
    const p = lm[i]; if ((p.visibility ?? 1) < 0.3) continue;
    x.fillStyle = i === 0 ? COL.C : (i % 2 ? COL.L : COL.R);
    x.beginPath(); x.arc(p.x * W, p.y * H, lw * 1.5, 0, Math.PI * 2); x.fill();
  }
}
function startLoop(){
  if (loopOn) return; loopOn = true;
  const tick = () => {
    if (!loopOn) return;
    const v = els.video;
    if (landmarker && v.readyState >= 2 && v.currentTime !== lastT){
      lastT = v.currentTime; VW = v.videoWidth || 1; VH = v.videoHeight || 1;
      const now = performance.now();
      if (lastTick) trackFps = ema(trackFps || 30, 1000 / Math.max(1, now - lastTick), 0.1);
      lastTick = now;
      let lm = null;
      try { lm = landmarker.detectForVideo(v, now).landmarks?.[0] || null; } catch(e){ console.error(e); }
      draw(lm);
      if (onPose) onPose(lm, now);
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function stopLoop(){ loopOn = false; onPose = null; lastTick = 0; trackFps = 0; }

let actx = null;
function unlockAudio(){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e){} }
function beep(freq = 880, dur = 0.12){
  if (!actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch(e){}
}
async function keepAwake(on){
  try {
    if (on && 'wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen');
    if (!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e){ wakeLock = null; }
}

function sparkHTML(points, w = 180, hgt = 60){
